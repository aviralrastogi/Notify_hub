<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>NotifyHub</title>
    <script src="https://cdn.onesignal.com/sdks/web/v16/OneSignalSDK.page.js" defer></script>
    <script>
      window.OneSignalDeferred = window.OneSignalDeferred || [];
      window.__oneSignalReady = new Promise(function (resolve, reject) {
        var settled = false;
        function finish(fn) {
          if (!settled) {
            settled = true;
            fn();
          }
        }

        setTimeout(function () {
          finish(function () {
            reject(new Error('OneSignal SDK script did not load (blocked, offline, or ad blocker).'));
          });
        }, 25000);

        OneSignalDeferred.push(async function (OneSignal) {
          var initTimer = setTimeout(function () {
            finish(function () {
              reject(new Error('OneSignal init timed out. Check /OneSignalSDKWorker.js loads in the browser.'));
            });
          }, 20000);

          try {
            await OneSignal.init({
              appId: "__ONESIGNAL_APP_ID__",
              notifyButton: { enable: false },
              allowLocalhostAsSecureOrigin: true,
              promptOptions: {
                slidedown: {
                  prompts: [{ type: 'push', autoPrompt: false }],
                },
              },
            });
            clearTimeout(initTimer);
            window.__OneSignal = OneSignal;
            finish(function () {
              resolve(OneSignal);
            });
          } catch (err) {
            clearTimeout(initTimer);
            finish(function () {
              reject(err);
            });
          }
        });
      });
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
